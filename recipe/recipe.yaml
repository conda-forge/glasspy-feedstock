schema_version: 1

context:
  python_min: "3.11"
  name: glasspy
  version: "0.6.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/glasspy-${{ version }}.tar.gz
  sha256: 777423bb6ec8cb6262426e3c6e0e9506aa53e2ccb74540f5e1c349bdd8e62b79

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - joblib >=1.5.0
    - onnxruntime >=1.23
    - requests >=2.30.0
    - python >=${{ python_min }}
    - pandas >=2.0.0
    - lmfit >=1.2.0
    - chemparse >=0.1.0
    - scikit-learn >=1.5.0
    - compress-pickle >=2.1.0
    - pytorch >=2.0.0
    - lightning >=2.1.0
    - platformdirs >=4.5.1

tests:
  - python:
      imports:
        - glasspy
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Python module for scientists working with glass materials
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://github.com/drcassar/glasspy

extra:
  recipe-maintainers:
    - jan-janssen
